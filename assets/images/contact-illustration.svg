<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="contactBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="cShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0369a1" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="500" rx="24" fill="url(#contactBg)"/>

  <!-- Flight Path Dashed Line -->
  <path d="M 120 400 C 180 320, 160 180, 260 210 C 340 230, 380 340, 470 200" fill="none" stroke="#93c5fd" stroke-width="3" stroke-dasharray="8,8"/>

  <!-- Big Stylized Paper Plane -->
  <g filter="url(#cShadow)">
    <polygon points="480,180 290,270 330,360" fill="#0284c7"/>
    <polygon points="480,180 330,360 380,310" fill="#0369a1"/>
    <polygon points="480,180 290,270 410,240" fill="#38bdf8"/>
    <polygon points="480,180 410,240 440,290" fill="#7dd3fc"/>
  </g>

  <!-- Interactive Message Bubble 1 -->
  <g filter="url(#cShadow)">
    <rect x="90" y="110" width="220" height="90" rx="16" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <circle cx="125" cy="145" r="16" fill="#e0f2fe"/>
    <!-- Chat Icon -->
    <path d="M 118 141 C 118 138 121 136 125 136 C 129 136 132 138 132 141 C 132 143 130 145 128 146 L 128 149 M 128 152 L 128 153" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
    <text x="150" y="142" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Terhubung Cepat</text>
    <text x="150" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Pesan langsung via portal</text>
  </g>

  <!-- Interactive Message Bubble 2 -->
  <g filter="url(#cShadow)">
    <rect x="330" y="330" width="210" height="90" rx="16" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <circle cx="365" cy="365" r="16" fill="#dcfce7"/>
    <path d="M 358 365 L 363 370 L 372 360" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="390" y="362" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Respon Fleksibel</text>
    <text x="390" y="380" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Siap berdiskusi ide seru</text>
  </g>
</svg>
