<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="bulbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="softShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#334155" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="500" rx="24" fill="url(#aboutGrad)"/>

  <!-- Gears / Process Symbols -->
  <g stroke="#cbd5e1" stroke-width="3" fill="none" opacity="0.6">
    <circle cx="120" cy="120" r="40"/>
    <circle cx="120" cy="120" r="20"/>
    <circle cx="480" cy="380" r="50"/>
    <circle cx="480" cy="380" r="25"/>
  </g>

  <!-- Big Central Idea Lightbulb -->
  <g filter="url(#softShadow2)">
    <circle cx="300" cy="200" r="85" fill="#fef3c7" stroke="#fcd34d" stroke-width="3"/>
    <!-- Glowing Rays -->
    <path d="M 300 80 L 300 60" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <path d="M 390 120 L 410 105" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <path d="M 210 120 L 190 105" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <path d="M 425 200 L 445 200" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <path d="M 175 200 L 155 200" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>

    <!-- Lightbulb Filament -->
    <path d="M 275 200 Q 285 160 300 160 Q 315 160 325 200" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
    <path d="M 285 200 L 315 200" stroke="#d97706" stroke-width="3"/>
    
    <!-- Bulb Base -->
    <path d="M 270 270 L 330 270 L 320 310 L 280 310 Z" fill="#94a3b8"/>
    <line x1="275" y1="285" x2="325" y2="285" stroke="#64748b" stroke-width="3"/>
    <line x1="278" y1="300" x2="322" y2="300" stroke="#64748b" stroke-width="3"/>
    <path d="M 288 310 C 288 322 312 322 312 310" fill="#475569"/>
  </g>

  <!-- Interactive Pillars (3 Cards) -->
  <g filter="url(#softShadow2)">
    <!-- Card 1: Visi -->
    <rect x="70" y="340" width="135" height="110" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <circle cx="100" cy="370" r="14" fill="#dbeafe"/>
    <path d="M 94 370 L 98 374 L 106 366" stroke="#2563eb" stroke-width="2" fill="none"/>
    <text x="85" y="405" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Inovasi</text>
    <text x="85" y="425" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Solusi modern</text>

    <!-- Card 2: Fokus -->
    <rect x="232" y="340" width="135" height="110" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <circle cx="262" cy="370" r="14" fill="#dcfce7"/>
    <path d="M 262 362 L 262 378 M 254 370 L 270 370" stroke="#16a34a" stroke-width="2"/>
    <text x="247" y="405" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Presisi</text>
    <text x="247" y="425" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Kualitas tinggi</text>

    <!-- Card 3: Nilai -->
    <rect x="395" y="340" width="135" height="110" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <circle cx="425" cy="370" r="14" fill="#ffedd5"/>
    <path d="M 425 363 L 428 371 L 436 371 L 430 376 L 432 384 L 425 379 L 418 384 L 420 376 L 414 371 L 422 371 Z" fill="#ea580c"/>
    <text x="410" y="405" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Integritas</text>
    <text x="410" y="425" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Kerja terpercaya</text>
  </g>
</svg>
