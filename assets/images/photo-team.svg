<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="skin1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="shirt1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="shirt2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="photoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Outer Rounded Portrait Frame -->
  <rect x="20" y="20" width="560" height="560" rx="40" fill="url(#avatarBg)" stroke="#bfdbfe" stroke-width="4"/>

  <!-- Background decorative tech elements -->
  <circle cx="110" cy="110" r="45" fill="#93c5fd" opacity="0.3"/>
  <circle cx="500" cy="130" r="60" fill="#38bdf8" opacity="0.25"/>
  <path d="M 80 440 Q 120 400 160 450 T 240 430" fill="none" stroke="#60a5fa" stroke-width="4" stroke-dasharray="6,6" opacity="0.4"/>
  <path d="M 420 420 Q 480 380 540 430" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6,6" opacity="0.4"/>

  <!-- Team Member 1 (Left - Frontend Specialist) -->
  <g id="member1" filter="url(#photoShadow)">
    <!-- Clothes / Hoodie -->
    <path d="M 100 580 C 100 450 160 410 240 410 C 270 410 290 420 310 435 C 320 490 320 540 320 580 Z" fill="url(#shirt2)"/>
    <!-- Collar / Inner Shirt -->
    <path d="M 215 410 Q 240 440 265 410 Z" fill="#e2e8f0"/>
    
    <!-- Neck -->
    <rect x="222" y="340" width="36" height="75" rx="8" fill="url(#skin1)"/>
    <!-- Head -->
    <ellipse cx="240" cy="280" rx="60" ry="70" fill="url(#skin1)"/>
    <!-- Hair -->
    <path d="M 175 270 C 170 210 210 180 250 180 C 290 180 315 210 310 250 C 300 230 280 220 240 220 C 195 220 180 250 175 270 Z" fill="#1e293b"/>
    <!-- Glasses -->
    <rect x="195" y="260" width="38" height="28" rx="8" fill="none" stroke="#0f172a" stroke-width="4"/>
    <rect x="247" y="260" width="38" height="28" rx="8" fill="none" stroke="#0f172a" stroke-width="4"/>
    <line x1="233" y1="274" x2="247" y2="274" stroke="#0f172a" stroke-width="4"/>
    <circle cx="214" cy="274" r="4.5" fill="#0f172a"/>
    <circle cx="266" cy="274" r="4.5" fill="#0f172a"/>
    <!-- Smile -->
    <path d="M 225 315 Q 240 330 255 315" stroke="#9a3412" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Team Member 2 (Right - Fullstack & UI/UX Specialist) -->
  <g id="member2" filter="url(#photoShadow)">
    <!-- Clothes / Blazer -->
    <path d="M 290 580 C 290 440 340 390 420 390 C 500 390 550 440 550 580 Z" fill="url(#shirt1)"/>
    <!-- Inner T-shirt -->
    <path d="M 390 390 Q 420 435 450 390 Z" fill="#ffffff"/>
    
    <!-- Neck -->
    <rect x="402" y="325" width="36" height="70" rx="8" fill="url(#skin2)"/>
    <!-- Head -->
    <ellipse cx="420" cy="265" rx="58" ry="68" fill="url(#skin2)"/>
    <!-- Modern Stylish Haircut -->
    <path d="M 358 260 C 355 190 410 165 450 165 C 490 165 495 200 485 245 C 475 210 440 200 410 205 C 380 210 365 240 358 260 Z" fill="#334155"/>
    <path d="M 450 165 Q 480 175 488 210 Z" fill="#1e293b"/>
    <!-- Eyes -->
    <circle cx="395" cy="260" r="5" fill="#0f172a"/>
    <circle cx="445" cy="260" r="5" fill="#0f172a"/>
    <!-- Eyebrows -->
    <path d="M 385 248 Q 395 243 405 248" stroke="#334155" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 435 248 Q 445 243 455 248" stroke="#334155" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Friendly Smile -->
    <path d="M 405 300 Q 420 316 435 300" stroke="#c2410c" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    
    <!-- Modern Headphone on neck -->
    <path d="M 380 340 Q 420 375 460 340" stroke="#0f172a" stroke-width="8" stroke-linecap="round" fill="none"/>
    <rect x="368" y="325" width="18" height="26" rx="6" fill="#0284c7"/>
    <rect x="454" y="325" width="18" height="26" rx="6" fill="#0284c7"/>
  </g>

  <!-- Foreground Laptop & Collaborative Badge -->
  <g filter="url(#photoShadow)">
    <rect x="220" y="500" width="220" height="75" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Code logo symbol -->
    <circle cx="250" cy="537" r="16" fill="#2563eb"/>
    <path d="M 245 532 L 240 537 L 245 542 M 255 532 L 260 537 L 255 542" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Text badge -->
    <text x="276" y="533" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Tim Pengembang Kami</text>
    <text x="276" y="549" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Kreatif, Gesit &amp; Berdedikasi</text>
  </g>
</svg>
