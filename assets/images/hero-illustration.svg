<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="50%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas Shapes -->
  <rect width="800" height="600" rx="24" fill="url(#heroBgGrad)"/>
  
  <!-- Floating abstract geometric decor -->
  <circle cx="680" cy="120" r="80" fill="#38bdf8" opacity="0.15"/>
  <circle cx="120" cy="480" r="90" fill="#818cf8" opacity="0.12"/>
  <rect x="660" y="440" width="70" height="70" rx="16" transform="rotate(25 695 475)" fill="#10b981" opacity="0.15"/>
  <rect x="80" y="100" width="60" height="60" rx="14" transform="rotate(-15 110 130)" fill="#f59e0b" opacity="0.15"/>

  <!-- Main Central Browser Window -->
  <g filter="url(#softShadow)">
    <rect x="150" y="100" width="500" height="360" rx="16" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Window Bar -->
    <rect x="150" y="100" width="500" height="42" rx="16" fill="#f1f5f9"/>
    <rect x="150" y="126" width="500" height="16" fill="#f1f5f9"/>
    <!-- Window Controls -->
    <circle cx="178" cy="121" r="5.5" fill="#f43f5e"/>
    <circle cx="196" cy="121" r="5.5" fill="#f59e0b"/>
    <circle cx="214" cy="121" r="5.5" fill="#10b981"/>
    <!-- URL search bar mock -->
    <rect x="245" y="112" width="280" height="18" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="260" y="118" width="120" height="6" rx="3" fill="#cbd5e1"/>
    
    <!-- Internal Code & Layout Content -->
    <rect x="180" y="165" width="200" height="18" rx="6" fill="#2563eb" opacity="0.9"/>
    <rect x="180" y="195" width="280" height="10" rx="5" fill="#94a3b8" opacity="0.7"/>
    <rect x="180" y="215" width="240" height="10" rx="5" fill="#cbd5e1" opacity="0.8"/>
    
    <!-- Code Editor Box -->
    <rect x="180" y="245" width="270" height="180" rx="10" fill="#0f172a"/>
    <circle cx="202" cy="265" r="4" fill="#38bdf8"/>
    <rect x="216" y="261" width="60" height="8" rx="4" fill="#64748b"/>
    <!-- Code Lines -->
    <rect x="202" y="285" width="90" height="8" rx="4" fill="#38bdf8"/>
    <rect x="300" y="285" width="70" height="8" rx="4" fill="#f472b6"/>
    <rect x="220" y="305" width="120" height="8" rx="4" fill="#34d399"/>
    <rect x="220" y="325" width="160" height="8" rx="4" fill="#fcd34d"/>
    <rect x="238" y="345" width="110" height="8" rx="4" fill="#60a5fa"/>
    <rect x="202" y="365" width="40" height="8" rx="4" fill="#38bdf8"/>
    <!-- Blinking Cursor -->
    <rect x="248" y="365" width="6" height="10" rx="2" fill="#38bdf8"/>
  </g>

  <!-- Interactive Floating UI Card 1 (Analytics/Success) -->
  <g filter="url(#softShadow)">
    <rect x="470" y="230" width="210" height="150" rx="14" fill="#ffffff" stroke="#e0e7ff" stroke-width="1.5"/>
    <circle cx="505" cy="265" r="16" fill="#dbeafe"/>
    <path d="M498 265 L503 270 L513 260" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="532" y="255" width="80" height="8" rx="4" fill="#1e293b"/>
    <rect x="532" y="269" width="50" height="6" rx="3" fill="#94a3b8"/>
    <!-- Mini Bar Chart -->
    <rect x="495" y="335" width="16" height="25" rx="4" fill="#93c5fd"/>
    <rect x="520" y="315" width="16" height="45" rx="4" fill="#60a5fa"/>
    <rect x="545" y="295" width="16" height="65" rx="4" fill="#3b82f6"/>
    <rect x="570" y="320" width="16" height="40" rx="4" fill="#60a5fa"/>
    <rect x="595" y="285" width="16" height="75" rx="4" fill="#1d4ed8"/>
    <rect x="620" y="305" width="16" height="55" rx="4" fill="#38bdf8"/>
  </g>

  <!-- Floating UI Card 2 (Performance / Light Theme Widget) -->
  <g filter="url(#softShadow)">
    <rect x="100" y="320" width="170" height="90" rx="14" fill="#ffffff" stroke="#dcfce7" stroke-width="1.5"/>
    <circle cx="132" cy="355" r="14" fill="#dcfce7"/>
    <path d="M128 355 L138 348 L134 358 L140 358 L126 366 L129 357 Z" fill="#16a34a"/>
    <text x="156" y="352" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">100% Cepat</text>
    <text x="156" y="367" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Vercel Ready</text>
    <rect x="118" y="388" width="134" height="6" rx="3" fill="#f1f5f9"/>
    <rect x="118" y="388" width="125" height="6" rx="3" fill="#10b981"/>
  </g>

  <!-- Floating Tag Badge -->
  <g filter="url(#softShadow)">
    <rect x="340" y="65" width="160" height="42" rx="21" fill="url(#primaryGrad)"/>
    <text x="420" y="91" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">HTML5 + Modern JS</text>
  </g>
</svg>
